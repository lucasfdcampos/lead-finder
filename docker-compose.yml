services:
  redis:
    image: redis:7-alpine
    container_name: lead-finder-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:7
    container_name: lead-finder-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  lead-finder:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lead-finder
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
    ports:
      - "8181:8080"
    environment:

      # ── MongoDB ──────────────────────────────────────────────────────────────
      MONGO_URI: mongodb://mongo:27017

      # ── Redis ────────────────────────────────────────────────────────────────
      REDIS_ADDR: redis:6379

      # ── Optional search / geo providers ─────────────────────────────────────
      BING_API_KEY:        ${BING_API_KEY:-}
      FOURSQUARE_API_KEY:  ${FOURSQUARE_API_KEY:-}
      LOCATIONIQ_API_KEY:  ${LOCATIONIQ_API_KEY:-}
      GOOGLE_SEARCH_API_KEY: ${GOOGLE_SEARCH_API_KEY:-}
      GOOGLE_CX:           ${GOOGLE_CX:-}
      SERPAPI_KEY:         ${SERPAPI_KEY:-}

      PORT: "8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  redis_data:
  mongo_data:
